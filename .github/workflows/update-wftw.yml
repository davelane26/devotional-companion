name: Update Word of the Week (CFC)

on:
  schedule:
    # Runs on Friday when CFC sends their weekly message (Bangalore UTC+5:30)
    - cron: '0 6 * * 5'    # Fri 06:00 UTC (11:30 AM IST)
    - cron: '0 14 * * 5'   # Fri 14:00 UTC (7:30 PM IST / 8:00 AM MDT)
    - cron: '0 2 * * 6'    # Sat 02:00 UTC (Saturday catchup)
  workflow_dispatch: {}    # Allows manual update anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-wftw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch latest Word of the Week editions
        run: |
          python scripts/fetch_wftw.py
          cp src/data/wftwData.json public/wftw.json

      - name: Commit and push if updated
        run: |
          if git diff --quiet src/data/wftwData.ts src/data/wftwData.json public/wftw.json; then
            echo "No new Word of the Week edition found; up to date."
            exit 0
          fi

          # Bump Service Worker cache version so PWAs and browsers refresh immediately
          CACHE_DATE=$(date +'%Y%m%d%H%M')
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'devotional-cache-$CACHE_DATE';/" public/sw.js

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/wftwData.ts src/data/wftwData.json public/wftw.json public/sw.js
          git commit -m "Update Word of the Week ($(date +'%Y-%m-%d'))"
          git pull --rebase
          git push
